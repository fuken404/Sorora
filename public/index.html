<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1436">
  <title>Sorora · Directorio de refugios</title>
  <meta name="description" content="Demostración de un directorio de refugios y alerta SOS para mujeres. No avisa a nadie: en una emergencia en Colombia, llama al 155 o al 123.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="crisis" role="note">
    <p class="crisis__text">
      <strong data-i18n="crisisLead"></strong>
      <span data-i18n="crisisBody"></span>
    </p>
    <p class="crisis__lines">
      <a href="tel:155"><b>155</b> <span data-i18n="line155"></span></a>
      <a href="tel:123"><b>123</b> <span data-i18n="line123"></span></a>
    </p>
  </aside>

  <main class="stage">
    <div id="map"></div>

    <header class="brand">
      <h1>Sorora</h1>
      <p class="brand__tagline" data-i18n="tagline"></p>
    </header>
    <div class="langs" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <p id="hint" class="hint" data-i18n="mapHint"></p>

    <section id="sheet" class="sheet" data-open="false">
      <button id="sos" type="button" class="sos"></button>

      <button id="handle" type="button" class="sheet__handle" aria-expanded="false" aria-controls="sheet-body">
        <span class="sheet__grip" aria-hidden="true"></span>
        <span class="sheet__title" data-i18n="directoryTitle"></span>
        <span id="summary" class="sheet__summary"></span>
        <svg class="sheet__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3"/></svg>
      </button>

      <div id="sheet-body" class="sheet__body">
        <div id="result" class="result" aria-live="polite" hidden></div>

        <div class="directory">
          <div class="directory__head">
            <h2 data-i18n="directoryTitle"></h2>
            <span class="tag" data-i18n="fictional"></span>
          </div>
          <ol id="shelters" class="shelters"></ol>
        </div>

        <div class="signal">
          <h2 data-i18n="signalTitle"></h2>
          <p data-i18n="signalBody"></p>
          <label id="key-field" class="key" hidden>
            <span data-i18n="keyLabel"></span>
            <input id="alert-key" type="password" autocomplete="off">
          </label>
        </div>

        <footer class="colophon">
          <h2 data-i18n="howTitle"></h2>
          <ol class="how">
            <li data-i18n="how1"></li>
            <li data-i18n="how2"></li>
            <li data-i18n="how3"></li>
          </ol>
          <p class="colophon__links">
            <a href="api/docs" data-i18n="docs"></a>
            <a href="https://github.com/fuken404/Sorora" data-i18n="code"></a>
            <span><span data-i18n="by"></span> <a href="https://fuken404.dev">Maycol Fuquene</a></span>
          </p>
        </footer>
      </div>
    </section>
  </main>

  <template id="shelter-row">
    <li class="shelter">
      <button type="button" class="shelter__button">
        <span class="shelter__number"></span>
        <span class="shelter__body">
          <span class="shelter__name"></span>
          <span class="shelter__meta"></span>
        </span>
        <span class="shelter__room"></span>
      </button>
    </li>
  </template>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
